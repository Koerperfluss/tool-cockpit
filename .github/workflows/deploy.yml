name: CI & Firebase Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Der Firebase-Deploy läuft bewusst nur manuell, damit CI nicht rot wird,
  # solange das Secret FIREBASE_SERVICE_ACCOUNT noch nicht gesetzt ist.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Erfordert das Repository-Secret FIREBASE_SERVICE_ACCOUNT
      # (JSON eines Service-Accounts mit der Rolle "Firebase Hosting Admin").
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gen-lang-client-0285074833
          target: cali-mobility
          channelId: live
